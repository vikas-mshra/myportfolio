# Netlify: static CRA build with postbuild prerender (scripts/prerender.mjs).
# Do not add a catch-all SPA rewrite that replaces prerendered index.html.
# Place public/404.html in the publish dir — Netlify serves it for missing paths.

[build]
  command = "npm run build"
  publish = "build"

# Canonical host: www → apex.
[[redirects]]
  from = "/*"
  to = "https://vikasmshra.com/:splat"
  status = 301
  force = true
  conditions = {Host = ["www.vikasmshra.com"]}

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/404.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/resources/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"
