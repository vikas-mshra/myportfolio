<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#0e1114" />
    <title>Page not found | Vikas Mishra</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="canonical" href="https://vikasmshra.com/" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0e1114;
        --text: #e8ecf1;
        --muted: #9aa5b1;
        --accent: #5b9a8b;
        --border: #2a323c;
        --font: "Sora", "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        font-family: var(--font);
        color: var(--text);
        background:
          radial-gradient(900px 500px at 10% -10%, rgba(91, 154, 139, 0.1), transparent 55%),
          var(--bg);
      }
      main {
        width: min(36rem, 100%);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 2rem;
        background: #161a1f;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.75rem;
        font-weight: 600;
      }
      p {
        margin: 0 0 1.25rem;
        color: var(--muted);
        line-height: 1.6;
      }
      a {
        color: var(--accent);
        text-underline-offset: 0.18em;
      }
      a:focus-visible {
        outline: 2px solid #7eb8aa;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>
        That URL is not part of this portfolio. Head back to the homepage to
        view selected work, experience, and contact details.
      </p>
      <p><a href="/">Return to vikasmshra.com</a></p>
    </main>
  </body>
</html>
